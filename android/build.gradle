buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Patch @react-native-voice/voice which uses the defunct jcenter() and
// is missing compileSdk — both break modern Android Gradle Plugin builds.
subprojects { subproject ->
    if (subproject.name == "react-native-voice_voice") {
        subproject.configurations.all {}
        subproject.afterEvaluate {
            // Replace jcenter() with mavenCentral() in all repository handlers
            subproject.repositories {
                maven { url "https://maven.google.com" }
                mavenCentral()
            }
            // Inject compileSdk if missing
            if (subproject.hasProperty("android")) {
                subproject.android {
                    compileSdk rootProject.ext.compileSdkVersion
                }
            }
        }
    }
}
